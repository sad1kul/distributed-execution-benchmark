name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: macos-14
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Record architecture
        run: uname -m
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify reference anchors
        run: python3 tools/reference.py --check
      - name: Verify generated vectors are current
        run: |
          python3 tools/reference.py --write
          git diff --exit-code

  sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Record architecture
        run: uname -m
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify reference anchors
        run: python3 tools/reference.py --check
      - name: Verify generated vectors are current
        run: |
          python3 tools/reference.py --write
          git diff --exit-code

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record architecture
        shell: pwsh
        run: |
          Write-Output $env:PROCESSOR_ARCHITECTURE
          Get-CimInstance Win32_Processor | Select-Object Name, AddressWidth
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify reference anchors
        run: python tools/reference.py --check
      - name: Verify generated vectors are current
        shell: pwsh
        run: |
          python tools/reference.py --write
          git diff --exit-code
